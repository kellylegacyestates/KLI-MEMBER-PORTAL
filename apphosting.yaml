# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables and secrets.
env:
  # Firebase Web SDK (browser-visible after build).
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyDHR1cUABh6LVJpjqy_qZUbxKsKDufRZI8"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "legacy-ai-production.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "legacy-ai-production"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "legacy-ai-production.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "990120571406"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:990120571406:web:3ef7493fc8827a2c44025f"
    availability:
      - BUILD
      - RUNTIME

  # Firebase Admin SDK. Prefer App Hosting runtime identity / Application
  # Default Credentials. FIREBASE_ADMIN_PROJECT_ID is optional when
  # GCLOUD_PROJECT or GOOGLE_CLOUD_PROJECT is present in the runtime.
  # If explicit service-account credentials are ever proven necessary, create
