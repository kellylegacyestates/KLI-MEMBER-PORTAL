# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables and secrets.
# Values are supplied from Firebase App Hosting / Cloud Secret Manager so real
# project configuration is never committed to the repository.
env:
  # Firebase Web SDK (browser-visible after build). These are secret-backed only
  # to avoid committing real values; they are still exposed in the client bundle.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: nextPublicFirebaseApiKey
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: nextPublicFirebaseAuthDomain
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: nextPublicFirebaseProjectId
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: nextPublicFirebaseStorageBucket
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: nextPublicFirebaseMessagingSenderId
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: nextPublicFirebaseAppId
    availability:
      - BUILD
      - RUNTIME

  # Firebase Admin SDK. Prefer App Hosting runtime identity / Application
  # Default Credentials. FIREBASE_ADMIN_PROJECT_ID is optional when
  # GCLOUD_PROJECT or GOOGLE_CLOUD_PROJECT is present in the runtime.
  # If explicit service-account credentials are ever proven necessary, create
  # these secrets in Secret Manager and uncomment the runtime-only bindings.
  # - variable: FIREBASE_ADMIN_PROJECT_ID
  #   secret: firebaseAdminProjectId
  #   availability:
  #     - RUNTIME
  # - variable: FIREBASE_ADMIN_CLIENT_EMAIL
  #   secret: firebaseAdminClientEmail
  #   availability:
  #     - RUNTIME
  # - variable: FIREBASE_ADMIN_PRIVATE_KEY
  #   secret: firebaseAdminPrivateKey
  #   availability:
  #     - RUNTIME
